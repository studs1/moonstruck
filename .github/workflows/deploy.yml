name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Täglich neu bauen, damit vergangene Auftritte automatisch verschwinden
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # Bereits optimierte Bilder (AVIF/WebP) zwischen den Läufen aufbewahren:
      # nur neue oder geänderte Bilder werden neu erzeugt (Build ~2 min → ~20 s).
      - name: Astro-Bildcache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp') }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
            astro-

      - name: Astro build
        run: npm run build
        env:
          # z.B. https://<user>.github.io + /moonstruck – oder https://www.moonstruck.ch + "" mit Custom Domain
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
